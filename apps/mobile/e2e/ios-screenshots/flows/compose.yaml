appId: com.alternativebot.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ALTERNATIVEBOT_ACTIVE_EMAIL: ${ALTERNATIVEBOT_SCREENSHOT_EMAIL}
- openLink: "alternativebot:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "alternativebot:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- takeScreenshot: 04-new-group-name
- openLink: "alternativebot:///"

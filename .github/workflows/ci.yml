name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR checks cancel together. On main, each job that leads to a deploy holds a per-job
# lock: one revision runs while only the newest waits, so a burst of merges deploys its last commit
# without stopping work already in progress. Main reruns only what the deploy needs; the pull
# request already ran the rest against the then-current main, and the nightly run refreshes the
# E2E screenshot baseline.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Testcontainers pulls Docker Hub images through Google's public mirror: anonymous Docker Hub pulls
# from shared runner IPs fail intermittently with "authentication required" or rate limits.
env:
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/

jobs:
  # Pull requests skip suites their files cannot affect (see .github/scripts/changed-areas.sh); a
  # job skipped by `if` still satisfies a required check. Main skips this job, and with it every
  # job that needs it.
  changes:
    name: Changed areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      server: ${{ steps.areas.outputs.server }}
      native: ${{ steps.areas.outputs.native }}
      compose: ${{ steps.areas.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The merge commit's first parent is the base, so this diff is exactly what the PR adds.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
      - id: areas
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"

  build:
    name: Production builds
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgres://alternativebot:alternativebot@127.0.0.1:5433/alternativebot
          BETTER_AUTH_SECRET: ci-build-auth-secret-at-least-32-characters
          ENCRYPTION_KEY: ci-build-encryption-key-at-least-32-characters
      - name: Electron smoke
        run: xvfb-run --auto-servernum pnpm --filter @alternativebot/desktop exec playwright test --config e2e/playwright.config.ts
      - name: Upload desktop setup screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-screenshots
          path: apps/desktop/e2e/screenshots
          if-no-files-found: ignore

  # Lint, typecheck and unit tests share one runner so a run installs once. A deploy needs this job,
  # so like Postgres journeys it checks its own changed areas to reach its main lock in push order.
  # Pull requests typecheck and test only the packages their files touch and the packages that
  # depend on them, unless a change sits outside the package graph; main always runs everything.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ci-checks-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        if: github.event_name == 'pull_request'
        run: pnpm lint
      - name: Check translation catalogs are current
        if: github.event_name == 'pull_request'
        run: |
          pnpm --filter @alternativebot/web intl:extract
          git diff --exit-code -- apps/web/src/locales
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://alternativebot:alternativebot@127.0.0.1:5433/alternativebot
      # Pull requests reuse main's typecheck results for packages whose inputs they leave unchanged.
      # Main starts with an empty cache, so it typechecks everything before a deploy.
      - name: Restore typecheck cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      - name: Typecheck
        if: steps.areas.outputs.all_packages != 'false'
        run: pnpm check
      - name: Typecheck affected packages
        if: steps.areas.outputs.all_packages == 'false'
        run: pnpm check --affected
        env:
          TURBO_SCM_BASE: HEAD^1
      - name: Save typecheck cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
      - name: Install age for the encrypted backup round trip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Unit tests
        if: steps.areas.outputs.all_packages != 'false'
        run: pnpm test
      - name: Unit tests for affected packages
        if: steps.areas.outputs.all_packages == 'false'
        env:
          TURBO_SCM_BASE: HEAD^1
        run: |
          affected="$(pnpm exec turbo ls --affected --output=json | jq -r '.packages.items[].path + "/"')"
          mapfile -t packages < <(printf "%s" "$affected")
          # These read other packages' files without importing them, so the package graph misses them.
          pnpm exec vitest run "${packages[@]}" \
            infra/updater/src/compose-env.test.ts \
            packages/adapters/src/lark-lazy-loading.test.ts \
            packages/testkit/src/ios-screenshot-catalog.test.ts
      - name: Host operations safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 infra/compose/host-safeguards.test.py
      - name: Codex subscription auth safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/codex-subscription-auth.test.py
      - name: Dependency update patch safety tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/dependency-update-patch.test.py
      - name: Changed-area classification tests
        if: steps.areas.outputs.all_packages != 'false'
        run: python3 .github/scripts/changed-areas.test.py
      - name: App Store review submission tests
        if: steps.areas.outputs.all_packages != 'false'
        run: node --test .github/scripts/app-store-review.test.mjs

  native-computer:
    name: Native computer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Windows pnpm launcher test
        if: runner.os == 'Windows'
        run: node --test scripts/pnpm.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://alternativebot:alternativebot@127.0.0.1:5433/alternativebot
      - run: pnpm --filter @alternativebot/desktop build
      - run: pnpm exec vitest run packages/adapters/src/host-computer.test.ts packages/adapters/src/desktop-sandbox-command.test.ts packages/adapters/src/desktop-sandbox-paths.test.ts packages/adapters/src/desktop-workspace-cleanup.test.ts packages/adapters/src/computer-support.test.ts apps/desktop/src/host-computer.test.ts
      - name: Native computer in headless Electron
        run: pnpm --filter @alternativebot/desktop exec electron ../../node_modules/vitest/vitest.mjs run --root ../.. packages/adapters/src/host-computer.test.ts apps/desktop/src/host-computer.test.ts
        env:
          ELECTRON_RUN_AS_NODE: "1"

  # Checks its own changed areas instead of needing `changes`: a deploy needs this job, and on main
  # it must reach its lock in push order so an older revision cannot replace a newer waiting one.
  # The suites are CPU-bound, so two runners finish in about half the time.
  test-integration-shard:
    name: Postgres journeys (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: ci-postgres-${{ matrix.shard }}-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: areas
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/changed-areas.sh >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.areas.outputs.server != 'false'
      - uses: actions/setup-node@v4
        if: steps.areas.outputs.server != 'false'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.areas.outputs.server != 'false'
      - run: pnpm test:integration --shard=${{ matrix.shard }}/2
        if: steps.areas.outputs.server != 'false'

  # The required check and the deploy gate, under one stable name.
  test-integration:
    name: Postgres journeys
    needs: test-integration-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-integration-shard.result }}" = success

  test-postgres-upgrade:
    name: Postgres upgrade
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: bash infra/compose/upgrade-postgres.docker-test.sh

  test-e2e:
    name: Web E2E
    needs: changes
    uses: ./.github/workflows/playwright.yml
    with:
      upload_artifacts: true
      # Skipped inside the called workflow so the required "Web E2E / Web E2E" check still reports.
      skip: ${{ needs.changes.outputs.e2e != 'true' }}

  # Publishes sha-<commit> and edge alongside the checks, so the production deploy pulls the
  # image this run built instead of building on the production host.
  publish-server-image:
    name: Publish server images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: ci-images-main
    uses: ./.github/workflows/publish-server-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  deploy-production:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    # The host pulls the image published for this commit; it builds only if that pull fails.
    # Only checks that catch a broken server gate the deploy; lint, E2E, and Docker drills report on their own.
    needs: [checks, test-integration, publish-server-image]
    runs-on: ubuntu-latest
    # Matches infra/compose/deploy-main.sh's own limits, including a fallback build and rollback.
    timeout-minutes: 45
    concurrency:
      group: production
      cancel-in-progress: false
      queue: max
    environment:
      name: production
      url: https://app.alternativebot.com
    steps:
      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/alternativebot-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/alternativebot-production" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/alternativebot-production" >/dev/null

      - name: Deploy successful main revision
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh -F /dev/null \
            -i "$HOME/.ssh/alternativebot-production" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" "deploy-main $GITHUB_SHA"
